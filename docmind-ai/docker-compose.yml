services:
  rag-service:
    build: ./rag-service
    container_name: docmind-rag-service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=nvidia
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=openai/gpt-oss-20b
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=openai/gpt-oss-20b
    volumes:
      - rag_data:/app/vector_stores
      - rag_uploads:/app/uploads
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: docmind-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - RAG_SERVICE_URL=http://rag-service:8000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - rag-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: docmind-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rag_data:
  rag_uploads:
