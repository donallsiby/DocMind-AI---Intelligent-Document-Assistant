services:
  # 1. AI RAG Service & API (FastAPI) - Free Web Service
  - type: web
    name: docmind-api
    runtime: python
    plan: free
    rootDir: docmind-ai/rag-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Frontend React App - Free Static Site
  - type: web
    name: docmind-frontend
    runtime: static
    rootDir: docmind-ai/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: docmind-ai/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: docmind-api
          property: host
