services:
  # 1. AI RAG Service & API (FastAPI) - 100% Free Web Service (No payment needed)
  - type: web
    name: docmind-api
    runtime: python
    plan: free
    rootDir: docmind-ai/rag-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: 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
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Frontend React App - 100% Free Static Site
  - type: static
    name: docmind-frontend
    runtime: static
    rootDir: docmind-ai/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: docmind-api
          property: host
